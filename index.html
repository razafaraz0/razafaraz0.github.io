function px(g){let r="";g.forEach((row,y)=>[...row].forEach((c,x)=>{if(c!==".")r+=`<rect x="${x}" y="${y}" width="1.03" height="1.03" class="${c}"/>`}));
  return `<svg viewBox="0 0 ${g[0].length} ${g.length}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`}
const $=s=>document.querySelector(s);
$("#sf").innerHTML=px(FOE);$("#sm").innerHTML=px(YOU);document.querySelectorAll(".tech").forEach(e=>{const t=e.dataset.t;e.innerHTML=px(TECH[t])+`<span>${TLABEL[t]}</span>`});
function fillIcons(root){root.querySelectorAll(".ico").forEach(e=>e.innerHTML=px(DOC))}
fillIcons(document);

// 8-bit sound (original synth tones)
let ac,muted=false;
function tone(f,t0,d,type="square",v=.07){
  if(muted||!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(v,ac.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t0+d);
  o.connect(g).connect(ac.destination);o.start(ac.currentTime+t0);o.stop(ac.currentTime+t0+d+.02);
}
const jingle=(a,s=.09)=>a.forEach((f,i)=>tone(f,i*s,s*1.6));
const blip=()=>tone(1200,0,.04,"square",.03);
const hit=()=>{for(let i=0;i<6;i++)tone(180-i*20,i*.05,.06,"sawtooth",.08)};

const text=$("#text"),skipBtn=$("#skip"),menu=$("#menu"),entry=$("#entry");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let skipped=false;
const wait=ms=>new Promise(r=>setTimeout(r,skipped?0:ms));
async function say(msg,pause=700){
  if(skipped||reduce){text.textContent=msg;return}
  text.textContent="";let n=0;
  for(const ch of msg){
    if(skipped){text.textContent=msg;return}
    text.textContent+=ch;if(ch!==" "&&n++%2===0)blip();await wait(30);
  }
  await wait(pause);
}
function show(e,btn){
  menu.querySelectorAll("button").forEach(b=>b.removeAttribute("aria-current"));
  btn.setAttribute("aria-current","true");
  entry.innerHTML=e.html;fillIcons(entry);entry.focus({preventScroll:true});jingle(e.snd);
  if(matchMedia("(max-width:640px)").matches)entry.scrollIntoView({behavior:"smooth",block:"start"});
}
ENTRIES.forEach(e=>{const b=document.createElement("button");b.type="button";b.textContent=e.label;
  if(e.cls)b.className=e.cls;b.onclick=()=>show(e,b);menu.appendChild(b)});
entry.innerHTML="<h2>POKÉDEX</h2><p>Select an entry to start.</p>";
function openDex(){
  skipped=true;skipBtn.hidden=true;
  text.textContent=`What will ${NAME} show?\nPick an entry below.`;
}
async function intro(){
  skipBtn.onclick=openDex;
  jingle([392,392,392,523,392,523,659,784],.11);
  $("#sf").classList.add("in");
  await say("A wild HIRING MANAGER\nappeared!");
  await say(`Hiring Manager wants to\nknow more about ${NAME}!`);
  if(!skipped)$("#sm").classList.add("in");
  await say(`Go! ${NAME}!`);
  if(!skipped)jingle([523,659,784,1047],.08);
  await say(`${NAME} used PORTFOLIO!\nIt's super effective!`,500);
  if(!skipped){hit();$("#sf").classList.add("flash");const h=$("#foehp");h.style.width="25%";h.classList.add("low");await wait(1300)}
  openDex();
}
$("#mute").onclick=e=>{muted=!muted;e.target.textContent="SOUND: "+(muted?"OFF":"ON")};
$("#go").onclick=()=>{ac=new(window.AudioContext||window.webkitAudioContext)();$("#start").hidden=true;intro()};
